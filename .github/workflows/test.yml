name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        mcp: ["mcp<2", "mcp>=2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "${{ matrix.mcp }}"
      - run: python -m pytest -q
      - run: python -c "import inventor_mcp.server"
