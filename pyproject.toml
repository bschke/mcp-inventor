[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventor-mcp"
version = "0.1.0"
description = "MCP server for controlling Autodesk Inventor via its COM API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inventor-mcp = "inventor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventor_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
